name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test and build (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: modern
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: cargo test
      - name: Build release
        run: cargo build --release
